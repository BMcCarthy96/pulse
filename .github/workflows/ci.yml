name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Same defaults the local configs use, so a CI failure is reproducible with `pnpm test`.
  POSTGRES_USER: pulse
  POSTGRES_PASSWORD: pulse

jobs:
  lint-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pulse/db generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm proof:check

  unit:
    name: Unit tests & coverage
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pulse/db generate

      # No services: the unit suite must stay runnable with nothing but Node.
      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  evals:
    name: Offline AI evals
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval:check
      - name: Upload deterministic eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-eval-report
          path: evals/reports/latest.*
          retention-days: 7

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pulse/db generate

      # The suite's own global-setup creates and migrates pulse_test.
      - name: Integration tests
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://pulse:pulse@localhost:5432/pulse_test
          TEST_REDIS_URL: redis://localhost:6379/1

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pulse/db generate
      - run: pnpm build
        env:
          # next build needs these present; values are irrelevant to a build.
          DATABASE_URL: postgresql://pulse:pulse@localhost:5432/pulse
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: build-time-placeholder-with-32-bytes
          AUTH_URL: https://pulse.example
          WEBHOOK_SIGNING_SECRET: build-time-webhook-secret-with-32-bytes

  # The worker image is what Railway actually deploys, and `pnpm build` proves nothing about it:
  # four separate defects (missing .dockerignore, missing prisma CLI, raw-TypeScript package
  # entry points, and a Prisma client that did not survive the prune) all sat in a Dockerfile
  # that had never been built. Building it here means the deployable artifact is covered by the
  # same pipeline as the code.
  docker:
    name: Worker image
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          load: true
          tags: pulse-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build that produces an image which cannot start is not a passing build. This is the
      # check that would have caught three of the four defects above.
      - name: Verify the image boots, migrates and reports healthy
        run: |
          docker network create pulse-ci
          docker run -d --name pg --network pulse-ci \
            -e POSTGRES_USER=pulse -e POSTGRES_PASSWORD=pulse -e POSTGRES_DB=pulse \
            --health-cmd "pg_isready -U pulse" --health-interval 5s --health-retries 20 postgres:16
          docker run -d --name redis --network pulse-ci \
            --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20 redis:7

          for i in $(seq 1 40); do
            pg=$(docker inspect -f '{{.State.Health.Status}}' pg)
            rd=$(docker inspect -f '{{.State.Health.Status}}' redis)
            [ "$pg" = healthy ] && [ "$rd" = healthy ] && break
            sleep 3
          done

          # Railway runs this as the release pre-deploy command. Apply the same
          # migrations in CI before the worker registers repeatable jobs.
          docker run --rm --network pulse-ci \
            -e DATABASE_URL=postgresql://pulse:pulse@pg:5432/pulse \
            pulse-worker:ci \
            ./node_modules/.bin/prisma migrate deploy --schema ./prisma/schema.prisma

          docker run -d --name worker --network pulse-ci -p 4001:4001 \
            -e DATABASE_URL=postgresql://pulse:pulse@pg:5432/pulse \
            -e REDIS_URL=redis://redis:6379 \
            -e NODE_ENV=production \
            -e PULSE_E2E=true \
            -e WEBHOOK_SIGNING_SECRET=ci-only-webhook-secret-with-32-bytes \
            -e WEBHOOK_TARGET_URL=http://127.0.0.1:3000 \
            -e SIMULATOR_BASE_URL=http://127.0.0.1:4001 \
            -e ANTHROPIC_API_KEY= \
            pulse-worker:ci

          for i in $(seq 1 40); do
            if curl -fsS http://localhost:4001/readyz >/dev/null 2>&1; then
              echo "worker healthy"
              docker logs worker 2>&1 | grep -q "queue workers started" \
                || { echo "queues never started"; docker logs worker; exit 1; }
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' worker)" != "true" ]; then
              echo "worker exited before becoming healthy:"; docker logs worker; exit 1
            fi
            sleep 3
          done
          echo "worker never became healthy:"; docker logs worker; exit 1

      - name: Scan worker image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: pulse-worker:ci
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    name: E2E (demo flow)
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pulse/db generate

      - name: Install Playwright browser
        run: pnpm --filter @pulse/web exec playwright install --with-deps chromium

      # `next start` needs a build, and `pnpm test:e2e` does not do one — it goes straight to
      # prepare-e2e-db.mjs and `playwright test`. Without this step the run dies at webServer
      # startup with "Could not find a production build in the '.next' directory".
      #
      # The pulse_e2e database is created, migrated and seeded by prepare-e2e-db.mjs, which the
      # `test:e2e` script runs before Playwright. It is deliberately not a Playwright
      # `globalSetup`: `webServer` processes start before globalSetup runs, so the worker would
      # boot against a database that does not exist yet.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://pulse:pulse@localhost:5432/pulse_e2e
          REDIS_URL: redis://localhost:6379/2
          AUTH_SECRET: e2e-secret-not-used-anywhere-else-32
          AUTH_URL: http://localhost:3010
          WEBHOOK_SIGNING_SECRET: e2e-webhook-secret-with-32-bytes
          PULSE_E2E: "true"
          # The login persona shortcuts are intentionally omitted from production, but the
          # browser suite exercises them as part of the local seeded demo contract.
          NEXT_PUBLIC_DEMO_PASSWORD: pulse-demo-2026

      - name: E2E
        run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: postgresql://pulse:pulse@localhost:5432/pulse_e2e
          E2E_REDIS_URL: redis://localhost:6379/2
          # Deliberately empty: the demo flow asserts graceful degradation, and CI never spends
          # money on model calls.
          ANTHROPIC_API_KEY: ""

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
